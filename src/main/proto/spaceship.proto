syntax = "proto3";
package spaceship;
option java_package = "edu.spaceship.proto";
option java_multiple_files = true;

service GameService {
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  string player_name = 1;
  string action = 2;
  string target = 3;
  string text = 4;
}

message ServerMessage {
  string type = 1;
  string text = 2;
  string player_id = 3;
  string role = 4;
  string phase = 5;
  int32 ship_integrity = 6;
}
